; Runs four processes in the backend container:
;   - Redis (loopback only) for the django-rq OCR queue
;   - Ollama serving the glm-ocr vision model on 127.0.0.1:11434
;   - RQ worker that picks up OCR jobs and calls Ollama on loopback
;   - Gunicorn (the only externally-reachable process)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --protected-mode yes
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama]
; Serves glm-ocr on loopback only. The model is baked into the image at
; build time so this just exec's `ollama serve` and the runtime accept
; loop comes up in ~1-2s; the first inference still pays a one-time GPU
; load cost (~30-60s) which the RQ worker's retry+timeout handles.
command=/usr/bin/ollama serve
environment=OLLAMA_HOST="127.0.0.1:11434",OLLAMA_MODELS="/root/.ollama/models",OLLAMA_KEEP_ALIVE="24h",OLLAMA_NUM_PARALLEL="%(ENV_OLLAMA_NUM_PARALLEL)s"
autostart=true
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rqworker]
command=/app/.venv/bin/python manage.py rqworker-pool ocr --num-workers %(ENV_RQ_WORKERS)s --worker-class rq.SimpleWorker
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
; --timeout is env-driven and defaults high (GUNICORN_TIMEOUT): the video
; detection endpoint streams SSE from a synchronous generator, which pins one
; sync worker for the WHOLE video. At the old hard-coded 300s, any video that
; took >5 min to process had its stream killed mid-way ("everything stops").
command=/app/.venv/bin/gunicorn detector.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s --workers %(ENV_WEB_CONCURRENCY)s --timeout %(ENV_GUNICORN_TIMEOUT)s --graceful-timeout 30 --access-logfile - --error-logfile -
directory=/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
