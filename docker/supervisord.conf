; Runs three processes in the backend container:
;   - Redis (loopback only) for the django-rq OCR queue
;   - RQ worker that picks up OCR jobs and calls remote GLM-OCR
;   - Gunicorn (the only externally-reachable process)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --protected-mode yes
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rqworker]
command=/app/.venv/bin/python manage.py rqworker-pool ocr --num-workers %(ENV_RQ_WORKERS)s --worker-class rq.SimpleWorker
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=/app/.venv/bin/gunicorn detector.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s --workers %(ENV_WEB_CONCURRENCY)s --timeout 300 --access-logfile - --error-logfile -
directory=/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
