; Runs three processes in the backend container. Redis (queue) and Postgres
; (DB) are EXTERNAL services (Coolify) reached via REDIS_URL / DATABASE_URL;
; GLM OCR is an EXTERNAL HTTP API (GLM_OCR_HOST). Nothing data-bearing is
; baked into this image.
;   - RQ worker — runs OCR jobs that call the external GLM OCR API
;   - Gunicorn (loopback only, 127.0.0.1:$GUNICORN_PORT) — app/API + SSE
;   - nginx (the only externally-reachable process) — serves /static/ off
;     disk and reverse-proxies everything else to Gunicorn

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:rqworker]
; OCR jobs only — each makes an HTTP call to the external GLM OCR box (no GPU
; needed here). Concurrency into that box is bounded by RQ_WORKERS. Connects
; to the external Redis via REDIS_URL.
command=/app/.venv/bin/python manage.py rqworker-pool ocr --num-workers %(ENV_RQ_WORKERS)s --worker-class rq.SimpleWorker
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:detectionworker]
; Background VIDEO DETECTION jobs — the whole point of the decoupling: a run
; lives here, NOT on the SSE request, so a closed browser / dropped connection
; / redeploy can't stop it. SEPARATE queue from `ocr` so a multi-hour video
; never blocks short OCR calls. SimpleWorker (no fork) keeps the YOLO model
; resident across jobs; bound to DETECTION_WORKERS to cap GPU memory.
command=/app/.venv/bin/python manage.py rqworker-pool detection --num-workers %(ENV_DETECTION_WORKERS)s --worker-class rq.SimpleWorker
directory=/app
autostart=true
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reaper]
; Self-healing backstop: re-enqueues any detection session whose worker died
; WITHOUT cleanup (OOM SIGKILL, redeploy mid-run) from processed_frames.
; SKIP_MODEL_PRELOAD=1 so this light process never loads YOLO.
environment=SKIP_MODEL_PRELOAD="1"
command=/app/.venv/bin/python manage.py reap_stalled_sessions --loop --interval %(ENV_REAPER_INTERVAL)s
directory=/app
autostart=true
autorestart=true
priority=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
; Binds loopback only now — nginx is the public face and proxies to it.
; --timeout is env-driven and defaults high (GUNICORN_TIMEOUT): the video
; detection endpoint streams SSE from a synchronous generator. With the
; gthread worker class a streaming response holds one THREAD, not a whole
; worker, so N concurrent videos no longer starve the API (the old sync
; class gave you exactly WEB_CONCURRENCY in-flight requests total). Static
; bytes are gone from here entirely — nginx serves those off disk.
command=/app/.venv/bin/gunicorn detector.wsgi:application --bind 127.0.0.1:%(ENV_GUNICORN_PORT)s --worker-class gthread --workers %(ENV_WEB_CONCURRENCY)s --threads %(ENV_GUNICORN_THREADS)s --timeout %(ENV_GUNICORN_TIMEOUT)s --graceful-timeout 30 --access-logfile - --error-logfile -
directory=/app
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; The only externally-reachable process. Config is rendered from the template
; by entrypoint.sh (the listen port follows $PORT). daemon off keeps it in the
; foreground so supervisord supervises it.
command=/usr/sbin/nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
