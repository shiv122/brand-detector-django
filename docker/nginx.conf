# nginx — the only externally-reachable process. It does two jobs:
#   1. Serve /static/ (frames, processed videos, csv_reports) straight off
#      disk with sendfile + a 1-year immutable cache. These never touch the
#      Python workers, so a 50-image gallery no longer queues behind the
#      handful of Gunicorn workers (which are also pinned for the whole of a
#      video by the SSE detection stream).
#   2. Reverse-proxy everything else to Gunicorn on loopback (127.0.0.1:8001),
#      with buffering OFF and long timeouts so the SSE stream and big video
#      uploads pass through untouched.
#
# __PORT__ is substituted with $PORT by docker/entrypoint.sh at boot (sed),
# because nginx does not expand env vars in its config itself.

user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Zero-copy file serving from the kernel — this is what makes static cheap.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip text responses from the app; images/video are already compressed.
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript text/plain;

    # Big video uploads stream through to the app.
    client_max_body_size 2048m;

    upstream app {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    server {
        listen __PORT__ default_server;
        server_name _;

        # Frames, processed videos, csv_reports: content-hashed / write-once,
        # so they can be cached forever. The browser never re-requests them
        # once cached, which kills the refetch storm on every gallery re-render.
        location /static/ {
            alias /app/staticfiles/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Everything else -> Gunicorn. Critically: buffering OFF so the
        # text/event-stream detection feed reaches the client incrementally,
        # and long read/send timeouts so a multi-minute video job is never
        # cut off mid-stream (matches GUNICORN_TIMEOUT).
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
